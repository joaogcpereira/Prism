    {k:'View',label:'Review Queue',meta:'',run:()=>go('queue')},
    {k:'View',label:'Applications',meta:'',run:()=>go('apps')},
    {k:'View',label:'Licenses & Pricing',meta:'',run:()=>go('licenses')},
    {k:'View',label:'Optimise',meta:'',run:()=>go('optimise')},
  ];
  (DATA.skus||[]).forEach(s=>it.push({k:'License',label:s.skuName,meta:s.skuPartNumber,run:()=>detail('sku',s.skuPartNumber)}));
  (DATA.watchedApps||[]).forEach(a=>it.push({k:'App',label:a.name,meta:a.vendor||'',run:()=>detail('app',a.name)}));
  [...new Set((DATA.reviewQueue||[]).map(r=>r.department).filter(Boolean))].forEach(d=>it.push({k:'Dept',label:d,meta:'',run:()=>detail('dept',d)}));
  [...new Set((DATA.reviewQueue||[]).map(r=>r.country).filter(Boolean))].forEach(c=>it.push({k:'Region',label:c,meta:'',run:()=>detail('country',c)}));
  const us=new Map();(DATA.reviewQueue||[]).forEach(r=>{if(!us.has(r.userId))us.set(r.userId,r);});
  [...us.values()].slice(0,500).forEach(r=>it.push({k:'User',label:r.displayName,meta:r.userPrincipalName,run:()=>detail('user',r.userPrincipalName)}));
  (DATA.devices||[]).slice(0,500).forEach(d=>it.push({k:'Device',label:d.deviceName,meta:d.operatingSystem,run:()=>detail('device',d.deviceName)}));
  return it;
}
function openCmdk(){if(!DATA)return;document.getElementById('cmdkScrim').classList.add('show');document.getElementById('cmdk').classList.add('show');
  const i=document.getElementById('cmdkInput');i.value='';i.focus();filterCmdk('');}
function closeCmdk(){document.getElementById('cmdkScrim').classList.remove('show');document.getElementById('cmdk').classList.remove('show');}
function filterCmdk(q){const all=cmdkBase();q=q.trim().toLowerCase();
  let list=q?all.filter(x=>(x.label+' '+x.k+' '+x.meta).toLowerCase().includes(q)).slice(0,40):all.slice(0,8);
  if(q&&_remote.length){const seen=new Set(list.map(x=>x.k+'|'+(x.label||'').toLowerCase()));
    _remote.forEach(x=>{const id=x.k+'|'+(x.label||'').toLowerCase();if(!seen.has(id)){seen.add(id);list.push(x);}});list=list.slice(0,48);}
  cmdkItems=list;cmdkActive=0;renderCmdk();}
function renderCmdk(){const l=document.getElementById('cmdkList');
  l.innerHTML=cmdkItems.length?cmdkItems.map((x,i)=>`<div class="it ${i===cmdkActive?'on':''}" data-i="${i}"><span class="k">${esc(x.k)}</span><span class="lb">${esc(x.label)}</span>${x.meta?`<span class="mt">${esc(x.meta)}</span>`:''}</div>`).join(''):`<div class="ce">No matches</div>`;
  l.querySelectorAll('.it').forEach(el=>el.onclick=()=>{const x=cmdkItems[+el.dataset.i];closeCmdk();x.run();});}
/* server-backed search: finds ANY user/device/app/SKU/department in the warehouse */
function scheduleRemote(q){clearTimeout(_srchTimer);q=(q||'').trim();if(!DATA||DATA.isSample||q.length<2){_remote=[];return;}
  _srchTimer=setTimeout(async()=>{const seq=++_srchSeq;
    try{const r=await fetch('api/search?q='+encodeURIComponent(q));if(!r.ok)return;const rows=await r.json();if(seq!==_srchSeq)return;
      const map={user:['User','user'],device:['Device','device'],app:['App','app'],sku:['License','sku'],department:['Dept','dept']};
      _remote=(rows||[]).map(x=>{const m=map[x.kind];return m?{k:m[0],label:x.label||x.key,meta:x.meta||'',run:()=>detail(m[1],x.key)}:null;}).filter(Boolean);
      filterCmdk(document.getElementById('cmdkInput').value);}catch(_){}},170);}
document.getElementById('cmdkScrim').onclick=closeCmdk;
document.getElementById('cmdkInput').addEventListener('input',e=>{filterCmdk(e.target.value);scheduleRemote(e.target.value);});
document.getElementById('cmdkInput').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();cmdkActive=Math.min(cmdkActive+1,cmdkItems.length-1);renderCmdk();}
  else if(e.key==='ArrowUp'){e.preventDefault();cmdkActive=Math.max(cmdkActive-1,0);renderCmdk();}
  else if(e.key==='Enter'&&cmdkItems[cmdkActive]){const x=cmdkItems[cmdkActive];closeCmdk();x.run();}
  else if(e.key==='Escape')closeCmdk();});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmdk();}});
load();
</script>
